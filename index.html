<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#050b18">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", sans-serif; color: #d8f6ff;
    background: radial-gradient(circle at 50% 0%, #0b2a4a 0%, #050b18 60%);
    padding-top: env(safe-area-inset-top);
  }
  header { text-align: center; padding: 14px 0 8px; position: relative; }
  .mini {
    position: absolute; right: 12px; top: 14px; padding: 6px 10px; font-size: 12px;
    background: transparent; border: 1px solid rgba(0, 229, 255, 0.4); color: #7df3ff; border-radius: 14px; font-weight: 400;
  }
  .core {
    width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 18px #00e5ff, inset 0 0 14px #00e5ff;
    position: relative; animation: pulse 3s ease-in-out infinite;
  }
  .core.busy { animation: pulse 0.8s ease-in-out infinite; }
  .core::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: #00e5ff; box-shadow: 0 0 16px #00e5ff;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px #00e5ff, inset 0 0 8px #00e5ff; }
    50% { box-shadow: 0 0 28px #00e5ff, inset 0 0 18px #00e5ff; }
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 6px; font-weight: 300; color: #7df3ff; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg {
    margin: 8px 0; padding: 11px 14px; border-radius: 16px;
    max-width: 82%; line-height: 1.4; font-size: 15px; white-space: pre-wrap;
  }
  .msg code { background: rgba(0, 229, 255, 0.18); padding: 1px 5px; border-radius: 4px; }
  .user {
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    margin-left: auto; border-bottom-right-radius: 4px; color: #fff;
  }
  .bot {
    background: rgba(0, 229, 255, 0.08); border: 1px solid rgba(0, 229, 255, 0.35);
    border-bottom-left-radius: 4px;
  }
  #bar {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(5, 11, 24, 0.9); border-top: 1px solid rgba(0, 229, 255, 0.25);
  }
  #in {
    flex: 1; padding: 12px 14px; border-radius: 22px; font-size: 16px;
    border: 1px solid rgba(0, 229, 255, 0.4); background: #08162b; color: #d8f6ff; outline: none;
  }
  #in:focus { box-shadow: 0 0 8px #00e5ff; }
  button {
    padding: 0 20px; border: none; border-radius: 22px; font-size: 15px;
    background: linear-gradient(135deg, #00b4d8, #00e5ff); color: #03121f; font-weight: 600;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>
  <button class="mini" onclick="newChat()">Neuer Chat</button>
  <div class="core" id="core"></div>
  <h1>J.A.R.V.I.S.</h1>
</header>
<div id="chat"></div>
<div id="bar">
  <input id="in" placeholder="Sag etwas zu Jarvis...">
  <button id="btn" onclick="send()">Senden</button>
</div>
<script>
const API_URL = "https://jarvis-api.behator99.workers.dev/";
const PERSONA = `Du bist Jarvis, der persönliche KI-Assistent deines Nutzers. Du sprichst Deutsch und duzt den Nutzer. Dein Ton: ruhig, souverän und höflich, mit trockenem Humor, wie ein erstklassiger Butler. Antworte kurz und präzise, außer der Nutzer will Details. Nutze bei Bedarf Listen. Wenn du etwas nicht weißt, sag es ehrlich.`;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let history = load("jarvis_history", []);
let facts = load("jarvis_facts", []);

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = fmt(text);
  document.getElementById("chat").appendChild(d);
  d.scrollIntoView();
  return d;
}

function buildSystem() {
  let s = PERSONA;
  if (facts.length) s += "\n\nDas weißt du über den Nutzer:\n- " + facts.join("\n- ");
  s += "\n\nAktuelles Datum und Uhrzeit: " + new Date().toLocaleString("de-DE");
  return s;
}

function newChat() {
  history = [];
  save("jarvis_history", history);
  document.getElementById("chat").innerHTML = "";
  add("Neuer Chat gestartet. Wie kann ich helfen?", "bot");
}

async function send() {
  const i = document.getElementById("in");
  const btn = document.getElementById("btn");
  const core = document.getElementById("core");
  const text = i.value.trim();
  if (!text) return;
  i.value = "";
  const lower = text.toLowerCase();

  if (lower.startsWith("merke dir")) {
    const fact = text.slice(9).replace(/^[\s:,]+/, "").trim();
    if (fact) {
      facts.push(fact);
      save("jarvis_facts", facts);
      add(text, "user");
      add("Gemerkt: " + fact, "bot");
      return;
    }
  }
  if (lower.includes("was weißt du über mich") || lower.includes("was weisst du über mich")) {
    add(text, "user");
    add(facts.length ? "Das weiß ich über dich:\n- " + facts.join("\n- ") : "Bisher weiß ich nichts. Sag einfach: Merke dir ...", "bot");
    return;
  }
  if (lower.startsWith("vergiss alles")) {
    facts = [];
    save("jarvis_facts", facts);
    add(text, "user");
    add("Erledigt. Mein Gedächtnis über dich ist gelöscht.", "bot");
    return;
  }

  add(text, "user");
  history.push({ role: "user", content: text });
  const wait = add("denkt nach...", "bot");
  btn.disabled = true;
  core.classList.add("busy");
  try {
    let msgs = history.slice(-19);
    while (msgs.length && msgs[0].role !== "user") msgs.shift();
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs, system: buildSystem() })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "API-Fehler");
    const reply = data.content[0].text;
    wait.innerHTML = fmt(reply);
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    history.pop();
    wait.textContent = "Fehler: " + e.message;
  }
  save("jarvis_history", history.slice(-40));
  btn.disabled = false;
  core.classList.remove("busy");
  wait.scrollIntoView();
}

document.getElementById("in").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

if (history.length) {
  history.forEach(m => add(m.content, m.role === "user" ? "user" : "bot"));
} else {
  add("Systeme online. Wie kann ich helfen?", "bot");
}
</script>
</body>
</html>
