<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#050b18">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", sans-serif; color: #d8f6ff;
    background: radial-gradient(circle at 50% 0%, #0b2a4a 0%, #050b18 60%);
    padding-top: env(safe-area-inset-top);
  }
  header { text-align: center; padding: 14px 0 8px; position: relative; }
  .mini {
    position: absolute; right: 12px; top: 14px; padding: 6px 10px; font-size: 12px;
    background: transparent; border: 1px solid rgba(0, 229, 255, 0.4); color: #7df3ff; border-radius: 14px; font-weight: 400;
  }
  .core {
    width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 18px #00e5ff, inset 0 0 14px #00e5ff;
    position: relative; animation: pulse 3s ease-in-out infinite;
  }
  .core.busy { animation: pulse 0.8s ease-in-out infinite; }
  .core::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: #00e5ff; box-shadow: 0 0 16px #00e5ff;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px #00e5ff, inset 0 0 8px #00e5ff; }
    50% { box-shadow: 0 0 28px #00e5ff, inset 0 0 18px #00e5ff; }
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 6px; font-weight: 300; color: #7df3ff; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg {
    margin: 8px 0; padding: 11px 14px; border-radius: 16px;
    max-width: 82%; line-height: 1.4; font-size: 15px; white-space: pre-wrap;
  }
  .msg code { background: rgba(0, 229, 255, 0.18); padding: 1px 5px; border-radius: 4px; }
  .msg img { width: 140px; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; display: block; }
  .user {
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    margin-left: auto; border-bottom-right-radius: 4px; color: #fff;
  }
  .bot {
    background: rgba(0, 229, 255, 0.08); border: 1px solid rgba(0, 229, 255, 0.35);
    border-bottom-left-radius: 4px;
  }
  #preview {
    display: none; align-items: center; padding: 6px 14px;
    background: rgba(5, 11, 24, 0.9); border-top: 1px solid rgba(0, 229, 255, 0.25);
  }
  #preview img { height: 56px; border-radius: 8px; }
  .x {
    margin-left: 10px; padding: 4px 10px; font-size: 14px;
    background: transparent; border: 1px solid rgba(0, 229, 255, 0.4); color: #7df3ff; font-weight: 400;
  }
  #bar {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(5, 11, 24, 0.9); border-top: 1px solid rgba(0, 229, 255, 0.25);
    align-items: center;
  }
  .photo {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(0, 229, 255, 0.5); font-size: 20px; flex-shrink: 0;
  }
  #in {
    flex: 1; padding: 12px 14px; border-radius: 22px; font-size: 16px; min-width: 0;
    border: 1px solid rgba(0, 229, 255, 0.4); background: #08162b; color: #d8f6ff; outline: none;
  }
  #in:focus { box-shadow: 0 0 8px #00e5ff; }
  button {
    padding: 0 20px; border: none; border-radius: 22px; font-size: 15px; height: 44px;
    background: linear-gradient(135deg, #00b4d8, #00e5ff); color: #03121f; font-weight: 600;
  }
  button.mini, button.x { height: auto; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>
  <button class="mini" onclick="newChat()">Neuer Chat</button>
  <div class="core" id="core"></div>
  <h1>J.A.R.V.I.S.</h1>
</header>
<div id="chat"></div>
<div id="preview"><img id="pimg"><button class="x" onclick="clearImg()">✕</button></div>
<div id="bar">
  <label class="photo" for="file">📷</label>
  <input type="file" id="file" accept="image/*" style="display:none">
  <input id="in" placeholder="Sag etwas zu Jarvis...">
  <button id="btn" onclick="send()">Senden</button>
</div>
<script>
const API_URL = "https://jarvis-api.behator99.workers.dev/";
const PERSONA = `Du bist Jarvis, der persönliche KI-Assistent deines Nutzers. Du sprichst Deutsch und duzt den Nutzer. Dein Ton: ruhig, souverän und höflich, mit trockenem Humor, wie ein erstklassiger Butler. Antworte kurz und präzise, außer der Nutzer will Details. Nutze bei Bedarf Listen. Wenn du etwas nicht weißt, sag es ehrlich.`;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let history = load("jarvis_history", []);
let facts = load("jarvis_facts", []);
let pendingImg = null;

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
}

function add(text, cls, imgUrl) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (imgUrl) {
    const im = document.createElement("img");
    im.src = imgUrl;
    d.appendChild(im);
    const sp = document.createElement("span");
    sp.innerHTML = fmt(text);
    d.appendChild(sp);
  } else {
    d.innerHTML = fmt(text);
  }
  document.getElementById("chat").appendChild(d);
  d.scrollIntoView();
  return d;
}

function buildSystem() {
  let s = PERSONA;
  if (facts.length) s += "\n\nDas weißt du über den Nutzer:\n- " + facts.join("\n- ");
  s += "\n\nAktuelles Datum und Uhrzeit: " + new Date().toLocaleString("de-DE");
  return s;
}

function buildMsgs() {
  let lastImg = -1;
  history.forEach((m, i) => { if (m.img) lastImg = i; });
  let msgs = history.map((m, i) => {
    if (m.img && i === lastImg) {
      return { role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: m.img } },
        { type: "text", text: m.content }
      ] };
    }
    return { role: m.role, content: m.hadImg ? "[Bild gesendet] " + m.content : m.content };
  });
  msgs = msgs.slice(-19);
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  return msgs;
}

function saveHistory() {
  save("jarvis_history", history.slice(-40).map(m => ({ role: m.role, content: m.content, hadImg: m.hadImg || false })));
}

function newChat() {
  history = [];
  saveHistory();
  document.getElementById("chat").innerHTML = "";
  add("Neuer Chat gestartet. Wie kann ich helfen?", "bot");
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL("image/jpeg", 0.8);
      URL.revokeObjectURL(url);
      resolve({ data: dataUrl.split(",")[1], url: dataUrl });
    };
    img.onerror = reject;
    img.src = url;
  });
}

document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    pendingImg = await shrink(f);
    document.getElementById("pimg").src = pendingImg.url;
    document.getElementById("preview").style.display = "flex";
  } catch (err) {
    add("Das Bild konnte nicht gelesen werden.", "bot");
  }
  e.target.value = "";
});

function clearImg() {
  pendingImg = null;
  document.getElementById("preview").style.display = "none";
}

async function send() {
  const i = document.getElementById("in");
  const btn = document.getElementById("btn");
  const core = document.getElementById("core");
  let text = i.value.trim();
  if (!text && !pendingImg) return;
  i.value = "";
  const lower = text.toLowerCase();

  if (!pendingImg) {
    if (lower.startsWith("merke dir")) {
      const fact = text.slice(9).replace(/^[\s:,]+/, "").trim();
      if (fact) {
        facts.push(fact);
        save("jarvis_facts", facts);
        add(text, "user");
        add("Gemerkt: " + fact, "bot");
        return;
      }
    }
    if (lower.includes("was weißt du über mich") || lower.includes("was weisst du über mich")) {
      add(text, "user");
      add(facts.length ? "Das weiß ich über dich:\n- " + facts.join("\n- ") : "Bisher weiß ich nichts. Sag einfach: Merke dir ...", "bot");
