<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#04100a">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", sans-serif; color: #e8f1ea;
    background: radial-gradient(circle at 50% 0%, #0a2418 0%, #04100a 60%);
    padding-top: env(safe-area-inset-top);
  }
  header { text-align: center; padding: 14px 0 8px; position: relative; }
  .mini {
    position: absolute; right: 12px; top: 14px; padding: 6px 10px; font-size: 12px;
    background: transparent; border: 1px solid rgba(143, 191, 159, 0.4); color: #cfe8d6; border-radius: 14px; font-weight: 400;
  }
  .core {
    width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%;
    border: 3px solid #8fbf9f;
    box-shadow: 0 0 18px #8fbf9f, inset 0 0 14px #8fbf9f;
    position: relative; animation: pulse 3s ease-in-out infinite;
  }
  .core.busy { animation: pulse 0.8s ease-in-out infinite; }
  .core::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: #8fbf9f; box-shadow: 0 0 16px #8fbf9f;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px #8fbf9f, inset 0 0 8px #8fbf9f; }
    50% { box-shadow: 0 0 28px #8fbf9f, inset 0 0 18px #8fbf9f; }
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 6px; font-weight: 300; color: #cfe8d6; }
  #chat, #search, #notes { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg {
    margin: 8px 0; padding: 11px 14px; border-radius: 16px;
    max-width: 82%; line-height: 1.4; font-size: 15px; white-space: pre-wrap;
  }
  .msg code { background: rgba(143, 191, 159, 0.18); padding: 1px 5px; border-radius: 4px; }
  .msg img { width: 140px; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; display: block; }
  .src { margin-top: 8px; padding-top: 4px; border-top: 1px solid rgba(143, 191, 159, 0.3); }
  .src a { display: block; margin-top: 4px; font-size: 12px; color: #cfe8d6; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user {
    background: linear-gradient(135deg, #4f7f68, #6fa58a);
    margin-left: auto; border-bottom-right-radius: 4px; color: #fff;
  }
  .bot {
    background: rgba(143, 191, 159, 0.08); border: 1px solid rgba(143, 191, 159, 0.35);
    border-bottom-left-radius: 4px;
  }
  #preview {
    display: none; align-items: center; padding: 6px 14px;
    background: rgba(3, 12, 8, 0.9); border-top: 1px solid rgba(143, 191, 159, 0.25);
  }
  #preview img { height: 56px; border-radius: 8px; }
  .x {
    margin-left: 10px; padding: 4px 10px; font-size: 14px;
    background: transparent; border: 1px solid rgba(143, 191, 159, 0.4); color: #cfe8d6; font-weight: 400;
  }
  #bar {
    display: flex; gap: 8px; padding: 10px 12px;
    background: rgba(3, 12, 8, 0.9); border-top: 1px solid rgba(143, 191, 159, 0.25);
    align-items: center;
  }
  .photo {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(143, 191, 159, 0.5); font-size: 20px; flex-shrink: 0;
  }
  #in {
    flex: 1; padding: 12px 14px; border-radius: 22px; font-size: 16px; min-width: 0;
    border: 1px solid rgba(143, 191, 159, 0.4); background: #081a12; color: #e8f1ea; outline: none;
  }
  #in:focus { box-shadow: 0 0 8px #8fbf9f; }
  button {
    padding: 0 20px; border: none; border-radius: 22px; font-size: 15px; height: 44px;
    background: linear-gradient(135deg, #6fa58a, #8fbf9f); color: #07150e; font-weight: 600;
  }
  button.mini, button.x { height: auto; }
  button:disabled { opacity: 0.5; }
  #nav {
    display: flex; background: rgba(3, 12, 8, 0.97);
    border-top: 1px solid rgba(143, 191, 159, 0.25); padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; height: 50px; padding: 0; border-radius: 0; background: transparent;
    color: #7f9a88; font-size: 13px; font-weight: 400;
  }
  .tab.on { color: #8fbf9f; font-weight: 600; box-shadow: inset 0 2px 0 #8fbf9f; }
  #sub { display: flex; gap: 8px; margin-bottom: 6px; }
  .sub { flex: 1; height: 36px; padding: 0; font-size: 14px; background: transparent; color: #7f9a88; border: 1px solid rgba(143, 191, 159, 0.3); font-weight: 400; }
  .sub.on { color: #07150e; background: linear-gradient(135deg, #6fa58a, #8fbf9f); font-weight: 600; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: rgba(143, 191, 159, 0.08); border: 1px solid rgba(143, 191, 159, 0.35); }
  .item span { flex: 1; word-break: break-word; white-space: pre-wrap; font-size: 15px; }
  .item.done span { text-decoration: line-through; opacity: 0.5; }
  .item input { width: 20px; height: 20px; accent-color: #8fbf9f; }
  button.del { height: auto; padding: 2px 8px; background: transparent; color: #cfe8d6; border: 1px solid rgba(143, 191, 159, 0.3); font-weight: 400; }
  .empty { opacity: 0.6; padding: 10px 4px; font-size: 14px; }
  .addrow { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 8px 0; background: #04100a; }
  #nin { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 22px; font-size: 16px; border: 1px solid rgba(143, 191, 159, 0.4); background: #081a12; color: #e8f1ea; outline: none; }
  .core { width: 52px; height: 52px; border: 1px solid #8fbf9f; box-shadow: 0 0 0 6px rgba(143, 191, 159, 0.10), 0 0 0 7px rgba(143, 191, 159, 0.35); animation: breathe 5s ease-in-out infinite; }
  .core.busy { animation: breathe 1.2s ease-in-out infinite; }
  .core::after { inset: 19px; box-shadow: 0 0 14px #8fbf9f; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; } }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: 10px; font-size: 17px; }
  .user { background: linear-gradient(135deg, #6fa58a, #a9d4b8); color: #07150e; }
  .msg { border-radius: 14px; }
</style>
</head>
<body>
<header>
  <button class="mini" onclick="newChat()">Neuer Chat</button>
  <div class="core" id="core"></div>
  <h1>JARVIS</h1>
</header>
<div id="chat"></div>
<div id="search" style="display:none"></div>
<div id="notes" style="display:none">
  <div id="sub"><button class="sub on" id="sub-n" onclick="subTab('n')">Notizen</button><button class="sub" id="sub-t" onclick="subTab('t')">Aufgaben</button></div>
  <div id="nlist"></div>
  <div id="tlist" style="display:none"></div>
  <div class="addrow"><input id="nin" placeholder="Neue Notiz..."><button onclick="addItem()">+</button></div>
</div>
<div id="preview"><img id="pimg"><button class="x" onclick="clearImg()">✕</button></div>
<div id="bar">
  <label class="photo" for="file">📷</label>
  <input type="file" id="file" accept="image/*" style="display:none">
  <input id="in" placeholder="Sag etwas zu Jarvis...">
  <button id="btn" onclick="send()">Senden</button>
</div>
<div id="nav">
  <button class="tab on" id="tab-chat" onclick="show('chat')">💬 Chat</button>
  <button class="tab" id="tab-search" onclick="show('search')">🔎 Suche</button>
  <button class="tab" id="tab-notes" onclick="show('notes')">📝 Notizen</button>
</div>
<script>
const API_URL = "https://jarvis-api.behator99.workers.dev/";
const PERSONA = `Du bist Jarvis, der persönliche KI-Assistent deines Nutzers. Du sprichst Deutsch und duzt den Nutzer. Dein Ton: ruhig, souverän und höflich, mit trockenem Humor, wie ein erstklassiger Butler. Antworte kurz und präzise, außer der Nutzer will Details. Nutze bei Bedarf Listen. Wenn du etwas nicht weißt, sag es ehrlich.`;
const SEARCH_PERSONA = `Du bist Jarvis im Suchmodus. Nutze die Websuche für aktuelle Informationen. Du sprichst Deutsch und duzt den Nutzer. Antworte kurz und präzise mit den wichtigsten Fakten und Zahlen. Sag ehrlich, wenn Quellen sich widersprechen oder du unsicher bist.`;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let facts = load("jarvis_facts", []);
const tabs = {
  chat: { key: "jarvis_history", h: load("jarvis_history", []), greet: "Systeme online. Wie kann ich helfen?" },
  search: { key: "jarvis_search", h: load("jarvis_search", []), greet: "Suchmodus bereit. Was soll ich im Web nachschlagen?" }
};
let cur = "chat";
let pendingImg = null;
let notes = load("jarvis_notes", []);
let todos = load("jarvis_todos", []);
let sub = "n";

function row(text, done, onDel, onTog) {
  const d = document.createElement("div");
  d.className = "item" + (done ? " done" : "");
  if (onTog) {
    const c = document.createElement("input");
    c.type = "checkbox";
    c.checked = done;
    c.onchange = onTog;
    d.appendChild(c);
  }
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  const b = document.createElement("button");
  b.className = "del";
  b.textContent = "✕";
  b.onclick = onDel;
  d.appendChild(b);
  return d;
}

function renderNotes() {
  const nl = document.getElementById("nlist"), tl = document.getElementById("tlist");
  nl.innerHTML = "";
  tl.innerHTML = "";
  if (!notes.length) nl.innerHTML = '<div class="empty">Noch keine Notizen.</div>';
  if (!todos.length) tl.innerHTML = '<div class="empty">Keine Aufgaben. Alles erledigt.</div>';
  notes.forEach((n, i) => nl.appendChild(row(n.text, false, () => { notes.splice(i, 1); save("jarvis_notes", notes); renderNotes(); })));
  todos.forEach((x, i) => tl.appendChild(row(x.text, x.done,
    () => { todos.splice(i, 1); save("jarvis_todos", todos); renderNotes(); },
    () => { x.done = !x.done; save("jarvis_todos", todos); renderNotes(); })));
}

function subTab(k) {
  sub = k;
  document.getElementById("nlist").style.display = k === "n" ? "block" : "none";
  document.getElementById("tlist").style.display = k === "t" ? "block" : "none";
  document.getElementById("sub-n").classList.toggle("on", k === "n");
  document.getElementById("sub-t").classList.toggle("on", k === "t");
  document.getElementById("nin").placeholder = k === "n" ? "Neue Notiz..." : "Neue Aufgabe...";
}

function addItem() {
  const i = document.getElementById("nin"), v = i.value.trim();
  if (!v) return;
  if (sub === "n") notes.unshift({ text: v }); else todos.push({ text: v, done: false });
  save("jarvis_notes", notes);
  save("jarvis_todos", todos);
  i.value = "";
  renderNotes();
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
}

function add(text, cls, imgUrl, pid) {
  const pane = document.getElementById(pid || cur);
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (imgUrl) {
    const im = document.createElement("img");
    im.src = imgUrl;
    d.appendChild(im);
    const sp = document.createElement("span");
    sp.innerHTML = fmt(text);
    d.appendChild(sp);
  } else {
    d.innerHTML = fmt(text);
  }
  pane.appendChild(d);
  if (pane.style.display !== "none") d.scrollIntoView();
  return d;
}

function addSources(el, list) {
  const seen = {};
  const items = list.filter(r => r && /^https?:\/\//.test(r.url) && !seen[r.url] && (seen[r.url] = true)).slice(0, 5);
  if (!items.length) return;
  const box = document.createElement("div");
  box.className = "src";
  items.forEach(r => {
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = r.title || r.url;
    box.appendChild(a);
  });
  el.appendChild(box);
}

function buildSystem(t) {
  let s = t === "search" ? SEARCH_PERSONA : PERSONA;
  if (t === "chat" && facts.length) s += "\n\nDas weißt du über den Nutzer:\n- " + facts.join("\n- ");
  if (t === "chat") {
    const open = todos.filter(x => !x.done).map(x => x.text);
    if (open.length) s += "\n\nOffene Aufgaben des Nutzers:\n- " + open.join("\n- ");
  }
  s += "\n\nAktuelles Datum und Uhrzeit: " + new Date().toLocaleString("de-DE");
  return s;
}

function buildMsgs(h) {
  let lastImg = -1;
  h.forEach((m, i) => { if (m.img) lastImg = i; });
  let msgs = h.map((m, i) => {
    if (m.img && i === lastImg) {
      return { role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: m.img } },
        { type: "text", text: m.content }
      ] };
    }
    return { role: m.role, content: m.hadImg ? "[Bild gesendet] " + m.content : m.content };
  });
  msgs = msgs.slice(-19);
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  return msgs;
}

function saveHistory(t) {
  const T = tabs[t];
  save(T.key, T.h.slice(-40).map(m => ({ role: m.role, content: m.content, hadImg: m.hadImg || false })));
}

function renderTab(t) {
  document.getElementById(t).innerHTML = "";
  const T = tabs[t];
  if (T.h.length) T.h.forEach(m => add((m.hadImg ? "📷 " : "") + m.content, m.role === "user" ? "user" : "bot", null, t));
  else add(T.greet, "bot", null, t);
}

function newChat() {
  if (!tabs[cur]) return;
  tabs[cur].h = [];
  saveHistory(cur);
  renderTab(cur);
}

function show(t) {
  cur = t;
  clearImg();
  ["chat", "search", "notes"].forEach(k => {
    document.getElementById(k).style.display = k === t ? "block" : "none";
    document.getElementById("tab-" + k).classList.toggle("on", k === t);
  });
  document.getElementById("bar").style.display = t === "notes" ? "none" : "flex";
  document.querySelector(".photo").style.display = t === "chat" ? "flex" : "none";
  document.getElementById("in").placeholder = t === "search" ? "Was soll ich suchen?" : "Sag etwas zu Jarvis...";
  const p = document.getElementById(t);
  p.scrollTop = p.scrollHeight;
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL("image/jpeg", 0.8);
      URL.revokeObjectURL(url);
      resolve({ data: dataUrl.split(",")[1], url: dataUrl });
    };
    img.onerror = reject;
    img.src = url;
  });
}

document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    pendingImg = await shrink(f);
    document.getElementById("pimg").src = pendingImg.url;
    document.getElementById("preview").style.display = "flex";
  } catch (err) {
    add("Das Bild konnte nicht gelesen werden.", "bot");
  }
  e.target.value = "";
});

function clearImg() {
  pendingImg = null;
  document.getElementById("preview").style.display = "none";
}

async function send() {
  const t = cur;
  const T = tabs[t];
  if (!T) return;
  const i = document.getElementById("in");
  const btn = document.getElementById("btn");
  const core = document.getElementById("core");
  let text = i.value.trim();
  const img = t === "chat" ? pendingImg : null;
  if (!text && !img) return;
  i.value = "";
  const lower = text.toLowerCase();

  if (t === "chat" && !img) {
    const nm = text.match(/^(notiz|aufgabe)\s*:\s*(.+)$/i);
    if (nm) {
      const isNote = nm[1].toLowerCase() === "notiz";
      const v = nm[2].trim();
      if (isNote) notes.unshift({ text: v }); else todos.push({ text: v, done: false });
      save("jarvis_notes", notes);
      save("jarvis_todos", todos);
      renderNotes();
      add(text, "user");
      add((isNote ? "Notiz" : "Aufgabe") + " gespeichert: " + v, "bot");
      return;
    }
    if (lower.startsWith("merke dir")) {
      const fact = text.slice(9).replace(/^[\s:,]+/, "").trim();
      if (fact) {
        facts.push(fact);
        save("jarvis_facts", facts);
        add(text, "user");
        add("Gemerkt: " + fact, "bot");
        return;
      }
    }
    if (lower.includes("was weißt du über mich") || lower.includes("was weisst du über mich")) {
      add(text, "user");
      add(facts.length ? "Das weiß ich über dich:\n- " + facts.join("\n- ") : "Bisher weiß ich nichts. Sag einfach: Merke dir ...", "bot");
      return;
    }
    if (lower.startsWith("vergiss alles")) {
      facts = [];
      save("jarvis_facts", facts);
      add(text, "user");
      add("Erledigt. Mein Gedächtnis über dich ist gelöscht.", "bot");
      return;
    }
  }

  if (img && !text) text = "Beschreibe dieses Bild.";
  add(text, "user", img ? img.url : null);
  T.h.push(img ? { role: "user", content: text, img: img.data, hadImg: true } : { role: "user", content: text });
  clearImg();
  const wait = add(t === "search" ? "sucht..." : "denkt nach...", "bot");
  btn.disabled = true;
  core.classList.add("busy");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: buildMsgs(T.h), system: buildSystem(t), mode: t === "search" ? "search" : "chat" })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "API-Fehler");
    const blocks = data.content || [];
    const reply = blocks.filter(b => b.type === "text").map(b => b.text).join("") || "Keine Antwort erhalten (Grund: " + (data.stop_reason || "unbekannt") + ").";
    wait.innerHTML = fmt(reply);
    const results = [];
    blocks.forEach(b => { if (b.type === "web_search_tool_result" && Array.isArray(b.content)) b.content.forEach(r => results.push(r)); });
    addSources(wait, results);
    T.h.push({ role: "assistant", content: reply });
  } catch (e) {
    T.h.pop();
    wait.textContent = "Fehler: " + e.message;
  }
  saveHistory(t);
  btn.disabled = false;
  core.classList.remove("busy");
  wait.scrollIntoView();
}

document.getElementById("in").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

renderTab("chat");
renderTab("search");
renderNotes();
document.getElementById("nin").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
show("chat");
</script>
</body>
</html>
