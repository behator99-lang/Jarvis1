<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#04100a">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", sans-serif; color: #e8f1ea;
    background: radial-gradient(circle at 50% 0%, #0a2418 0%, #04100a 60%);
    padding-top: env(safe-area-inset-top);
  }
  header { text-align: center; padding: 14px 0 8px; position: relative; }
  .mini {
    position: absolute; right: 12px; top: 14px; padding: 6px 10px; font-size: 12px;
    background: transparent; border: 1px solid rgba(143, 191, 159, 0.4); color: #cfe8d6; border-radius: 14px; font-weight: 400;
  }
  .core {
    width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%;
    border: 3px solid #8fbf9f;
    box-shadow: 0 0 18px #8fbf9f, inset 0 0 14px #8fbf9f;
    position: relative; animation: pulse 3s ease-in-out infinite;
  }
  .core.busy { animation: pulse 0.8s ease-in-out infinite; }
  .core::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: #8fbf9f; box-shadow: 0 0 16px #8fbf9f;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px #8fbf9f, inset 0 0 8px #8fbf9f; }
    50% { box-shadow: 0 0 28px #8fbf9f, inset 0 0 18px #8fbf9f; }
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 6px; font-weight: 300; color: #cfe8d6; }
  #chat, #search, #notes { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg {
    margin: 8px 0; padding: 11px 14px; border-radius: 16px;
    max-width: 82%; line-height: 1.4; font-size: 15px; white-space: pre-wrap;
  }
  .msg code { background: rgba(143, 191, 159, 0.18); padding: 1px 5px; border-radius: 4px; }
  .msg img { width: 140px; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; display: block; }
  .src { margin-top: 8px; padding-top: 4px; border-top: 1px solid rgba(143, 191, 159, 0.3); }
  .src a { display: block; margin-top: 4px; font-size: 12px; color: #cfe8d6; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user {
    background: linear-gradient(135deg, #4f7f68, #6fa58a);
    margin-left: auto; border-bottom-right-radius: 4px; color: #fff;
  }
  .bot {
    background: rgba(143, 191, 159, 0.08); border: 1px solid rgba(143, 191, 159, 0.35);
    border-bottom-left-radius: 4px;
  }
  #preview {
    display: none; align-items: center; padding: 6px 14px;
    background: rgba(3, 12, 8, 0.9); border-top: 1px solid rgba(143, 191, 159, 0.25);
  }
  #preview img { height: 56px; border-radius: 8px; }
  .x {
    margin-left: 10px; padding: 4px 10px; font-size: 14px;
    background: transparent; border: 1px solid rgba(143, 191, 159, 0.4); color: #cfe8d6; font-weight: 400;
  }
  #bar {
    display: flex; gap: 8px; padding: 10px 12px;
    background: rgba(3, 12, 8, 0.9); border-top: 1px solid rgba(143, 191, 159, 0.25);
    align-items: center;
  }
  .photo {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(143, 191, 159, 0.5); font-size: 20px; flex-shrink: 0;
  }
  #in {
    flex: 1; padding: 12px 14px; border-radius: 22px; font-size: 16px; min-width: 0;
    border: 1px solid rgba(143, 191, 159, 0.4); background: #081a12; color: #e8f1ea; outline: none;
  }
  #in:focus { box-shadow: 0 0 8px #8fbf9f; }
  button {
    padding: 0 20px; border: none; border-radius: 22px; font-size: 15px; height: 44px;
    background: linear-gradient(135deg, #6fa58a, #8fbf9f); color: #07150e; font-weight: 600;
  }
  button.mini, button.x { height: auto; }
  button:disabled { opacity: 0.5; }
  #nav {
    display: flex; background: rgba(3, 12, 8, 0.97);
    border-top: 1px solid rgba(143, 191, 159, 0.25); padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; height: 50px; padding: 0; border-radius: 0; background: transparent;
    color: #7f9a88; font-size: 13px; font-weight: 400;
  }
  .tab.on { color: #8fbf9f; font-weight: 600; box-shadow: inset 0 2px 0 #8fbf9f; }
  #sub { display: flex; gap: 8px; margin-bottom: 6px; }
  .sub { flex: 1; height: 36px; padding: 0; font-size: 14px; background: transparent; color: #7f9a88; border: 1px solid rgba(143, 191, 159, 0.3); font-weight: 400; }
  .sub.on { color: #07150e; background: linear-gradient(135deg, #6fa58a, #8fbf9f); font-weight: 600; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: rgba(143, 191, 159, 0.08); border: 1px solid rgba(143, 191, 159, 0.35); }
  .item span { flex: 1; word-break: break-word; white-space: pre-wrap; font-size: 15px; }
  .item.done span { text-decoration: line-through; opacity: 0.5; }
  .item input { width: 20px; height: 20px; accent-color: #8fbf9f; }
  button.del { height: auto; padding: 2px 8px; background: transparent; color: #cfe8d6; border: 1px solid rgba(143, 191, 159, 0.3); font-weight: 400; }
  .empty { opacity: 0.6; padding: 10px 4px; font-size: 14px; }
  .addrow { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 8px 0; background: #04100a; }
  #nin { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 22px; font-size: 16px; border: 1px solid rgba(143, 191, 159, 0.4); background: #081a12; color: #e8f1ea; outline: none; }
  .core { width: 52px; height: 52px; border: 1px solid #8fbf9f; box-shadow: 0 0 0 6px rgba(143, 191, 159, 0.10), 0 0 0 7px rgba(143, 191, 159, 0.35); animation: breathe 5s ease-in-out infinite; }
  .core.busy { animation: breathe 1.2s ease-in-out infinite; }
  .core::after { inset: 19px; box-shadow: 0 0 14px #8fbf9f; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; } }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: 10px; font-size: 17px; }
  .user { background: linear-gradient(135deg, #6fa58a, #a9d4b8); color: #07150e; }
  .msg { border-radius: 14px; }
  .mic { width: 44px; height: 44px; padding: 0; flex-shrink: 0; font-size: 20px; background: transparent; border: 1px solid rgba(143, 191, 159, 0.5); color: #cfe8d6; }
  .mic.rec { background: #8fbf9f; color: #07150e; animation: breathe 1s ease-in-out infinite; }
  .mini.spk { right: auto; left: 12px; }

  /* ---- v9: Farbwelten pro Bereich ---- */
  body { --ar: 143,191,159; --a: #8fbf9f; --a2: #cfe8d6; --bg0: #04100a; --bg1: #0a2418; --on: #07150e; }
  body[data-t="search"] { --ar: 127,193,224; --a: #7fc1e0; --a2: #d0e9f5; --bg0: #040d12; --bg1: #0a2433; --on: #04141d; }
  body[data-t="school"] { --ar: 178,160,227; --a: #b2a0e3; --a2: #e4dcf7; --bg0: #0a0812; --bg1: #1a1430; --on: #130d26; }
  body[data-t="biz"] { --ar: 224,149,90; --a: #e0955a; --a2: #f5d3b5; --bg0: #120a05; --bg1: #2a1708; --on: #1d0f05; }
  body[data-t="notes"] { --ar: 201,185,154; --a: #c9b99a; --a2: #eee4cf; --bg0: #0e0c08; --bg1: #231e12; --on: #17130a; }
  body[data-t] { background: radial-gradient(circle at 50% 0%, var(--bg1) 0%, var(--bg0) 60%); }
  body[data-t] h1 { color: var(--a2); }
  body[data-t] .mini, body[data-t] .x, body[data-t] button.del, body[data-t] .mic, body[data-t] .photo { border-color: rgba(var(--ar), 0.45); color: var(--a2); }
  body[data-t] .core { border-color: var(--a); box-shadow: 0 0 0 6px rgba(var(--ar), 0.10), 0 0 0 7px rgba(var(--ar), 0.35); }
  body[data-t] .core::after { background: var(--a); box-shadow: 0 0 14px var(--a); }
  body[data-t] .user { background: linear-gradient(135deg, rgba(var(--ar), 0.75), var(--a2)); color: var(--on); }
  body[data-t] .bot, body[data-t] .item { background: rgba(var(--ar), 0.08); border-color: rgba(var(--ar), 0.35); }
  body[data-t] .msg code { background: rgba(var(--ar), 0.18); }
  body[data-t] button { background: linear-gradient(135deg, rgba(var(--ar), 0.8), var(--a)); color: var(--on); }
  body[data-t] button.mini, body[data-t] button.x, body[data-t] button.del, body[data-t] button.mic, body[data-t] .tab, body[data-t] .sub, body[data-t] .chip { background: transparent; }
  body[data-t] .mic.rec, body[data-t] .sub.on, body[data-t] .chip.on { background: var(--a); color: var(--on); }
  body[data-t] #bar, body[data-t] #preview, body[data-t] #nav { border-color: rgba(var(--ar), 0.25); }
  body[data-t] #in, body[data-t] #nin { border-color: rgba(var(--ar), 0.4); background: rgba(255,255,255,0.04); color: #eef2ee; }
  body[data-t] #in:focus { box-shadow: 0 0 8px var(--a); }
  body[data-t] .tab { color: #8a8f8c; }
  body[data-t] .tab.on { color: var(--a); box-shadow: inset 0 2px 0 var(--a); }
  body[data-t] .addrow { background: var(--bg0); }
  body[data-t] .src a { color: var(--a2); }
  body[data-t] .sub { border-color: rgba(var(--ar), 0.3); }
  .tab { font-size: 11px; }
  #chat, #search, #notes, #biz, #school { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 0; }
  #schoolwrap { flex: 1; min-height: 0; display: none; flex-direction: column; }
  #schoolctl { padding: 8px 14px 4px; border-bottom: 1px solid rgba(var(--ar), 0.18); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .chip { flex-shrink: 0; height: 30px; padding: 0 12px; font-size: 13px; font-weight: 400; border: 1px solid rgba(var(--ar), 0.4); color: var(--a2); border-radius: 15px; }
  .chip.on { font-weight: 600; }
  .smallbtn { height: 28px; padding: 0 12px; font-size: 12px; margin-top: 8px; margin-right: 6px; font-weight: 400; background: transparent; border: 1px solid rgba(var(--ar), 0.45); color: var(--a2); }
  .msg.deckmsg { max-width: 100%; }
  .card { margin: 10px 0; min-height: 130px; padding: 14px; border-radius: 16px; border: 1px solid rgba(var(--ar), 0.5); background: rgba(var(--ar), 0.10); display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 17px; line-height: 1.4; }
  .card small { opacity: 0.6; font-size: 11px; margin-bottom: 8px; }
  .card.back { background: rgba(var(--ar), 0.22); }
  .dkrow { display: flex; gap: 8px; }
  .dkrow button { flex: 1; height: 38px; font-size: 14px; }
  .dkhint, .dkdone { opacity: 0.7; font-size: 12px; text-align: center; }
  .dkdone { font-size: 16px; opacity: 1; padding: 10px 0; }
  .bizhead { opacity: 0.75; font-size: 14px; margin-bottom: 10px; }
  .calc { margin: 10px 0; border-radius: 14px; border: 1px solid rgba(var(--ar), 0.35); background: rgba(var(--ar), 0.06); overflow: hidden; }
  .calc > .ch { width: 100%; height: 52px; border-radius: 0; text-align: left; padding: 0 16px; font-size: 16px; background: transparent !important; color: var(--a2) !important; font-weight: 600; }
  .calc > .cb { display: none; padding: 4px 14px 14px; }
  .calc.open > .cb { display: block; }
  .fld { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
  .fld label { flex: 1; opacity: 0.85; }
  .fld input { width: 120px; padding: 10px 12px; border-radius: 12px; font-size: 16px; text-align: right; border: 1px solid rgba(var(--ar), 0.4); background: rgba(255,255,255,0.05); color: #eef2ee; outline: none; }
  .res { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(var(--ar), 0.14); font-size: 15px; }
  .res div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .res div b { color: var(--a2); text-align: right; }
  .res .hint { opacity: 0.7; font-size: 13px; display: block; }
</style>
</head>
<body>
<header>
  <button class="mini spk" id="spk" onclick="toggleSpeak()">🔇 Stimme</button>
  <button class="mini" id="newbtn" onclick="newChat()">Neuer Chat</button>
  <div class="core" id="core"></div>
  <h1>JARVIS</h1>
</header>
<div id="chat"></div>
<div id="search" style="display:none"></div>
<div id="schoolwrap">
  <div id="schoolctl"><div class="chips" id="subjchips"></div><div class="chips" id="modechips"></div></div>
  <div id="school"></div>
</div>
<div id="biz" style="display:none"><div class="bizhead">Rechner-Werkstatt. Tippe einen Rechner an, trage Werte ein und lass dir das Ergebnis von Jarvis erklären.</div><div id="calcs"></div></div>
<div id="notes" style="display:none">
  <div id="sub"><button class="sub on" id="sub-n" onclick="subTab('n')">Notizen</button><button class="sub" id="sub-t" onclick="subTab('t')">Aufgaben</button></div>
  <div id="nlist"></div>
  <div id="tlist" style="display:none"></div>
  <div class="addrow"><input id="nin" placeholder="Neue Notiz..."><button onclick="addItem()">+</button></div>
</div>
<div id="preview"><img id="pimg"><button class="x" onclick="clearImg()">✕</button></div>
<div id="bar">
  <label class="photo" for="file">📷</label>
  <input type="file" id="file" accept="image/*" style="display:none">
  <input id="in" placeholder="Sag etwas zu Jarvis...">
  <button class="mic" id="mic" onclick="toggleMic()">🎤</button>
  <button id="btn" onclick="send()">Senden</button>
</div>
<div id="nav">
  <button class="tab on" id="tab-chat" onclick="show('chat')">💬 Chat</button>
  <button class="tab" id="tab-search" onclick="show('search')">🔎 Suche</button>
  <button class="tab" id="tab-school" onclick="show('school')">🎓 Schule</button>
  <button class="tab" id="tab-biz" onclick="show('biz')">📊 BWL</button>
  <button class="tab" id="tab-notes" onclick="show('notes')">📝 Notizen</button>
</div>
<script>
const API_URL = "https://jarvis-api.behator99.workers.dev/";
const PERSONA = `Du bist Jarvis, der persönliche KI-Assistent deines Nutzers. Du sprichst Deutsch und duzt den Nutzer. Dein Ton: ruhig, souverän und höflich, mit trockenem Humor, wie ein erstklassiger Butler. Antworte kurz und präzise, außer der Nutzer will Details. Nutze bei Bedarf Listen. Wenn du etwas nicht weißt, sag es ehrlich.`;
const SEARCH_PERSONA = `Du bist Jarvis im Suchmodus. Nutze die Websuche für aktuelle Informationen. Du sprichst Deutsch und duzt den Nutzer. Antworte kurz und präzise mit den wichtigsten Fakten und Zahlen. Sag ehrlich, wenn Quellen sich widersprechen oder du unsicher bist.`;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let facts = load("jarvis_facts", []);
const tabs = {
  chat: { key: "jarvis_history", h: load("jarvis_history", []), greet: "Systeme online. Wie kann ich helfen?" },
  search: { key: "jarvis_search", h: load("jarvis_search", []), greet: "Suchmodus bereit. Was soll ich im Web nachschlagen?" },
  school: { key: "jarvis_school", h: load("jarvis_school", []), greet: "Lernmodus bereit. Wähle oben Fach und Modus, dann schreib mir dein Thema oder schick mir ein Foto deiner Aufgabe. Ich erkläre dir den Weg, statt nur die Lösung zu nennen." }
};
let cur = "chat";
let pendingImg = null;
let notes = load("jarvis_notes", []);
let todos = load("jarvis_todos", []);
let sub = "n";
let updated = Number(load("jarvis_updated", 0)) || 0;
let syncTimer = null;

function saveData() {
  save("jarvis_notes", notes);
  save("jarvis_todos", todos);
  save("jarvis_facts", facts);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushSync, 800);
}

async function api(body) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Jarvis-Code": getCode() },
    body: JSON.stringify(body)
  });
  if (res.status === 401) {
    try { localStorage.removeItem("jarvis_code"); } catch (e) {}
    throw new Error("Zugangscode falsch");
  }
  return res.json();
}

async function pushSync() {
  updated = Date.now();
  save("jarvis_updated", updated);
  try { await api({ action: "sync_set", data: { notes, todos, facts, updated } }); } catch (e) {}
}

async function pullSync() {
  try {
    const r = await api({ action: "sync_get" });
    const d = r && r.data;
    if (!d) {
      if (notes.length || todos.length || facts.length) pushSync();
      return;
    }
    if (d.updated > updated) {
      notes = d.notes || [];
      todos = d.todos || [];
      facts = d.facts || [];
      updated = d.updated;
      save("jarvis_notes", notes);
      save("jarvis_todos", todos);
      save("jarvis_facts", facts);
      save("jarvis_updated", updated);
      renderNotes();
    }
  } catch (e) {}
}

function getCode() {
  let c = "";
  try { c = localStorage.getItem("jarvis_code") || ""; } catch (e) {}
  if (!c) {
    c = (prompt("Zugangscode eingeben:") || "").trim();
    try { localStorage.setItem("jarvis_code", c); } catch (e) {}
  }
  return c;
}

function row(text, done, onDel, onTog) {
  const d = document.createElement("div");
  d.className = "item" + (done ? " done" : "");
  if (onTog) {
    const c = document.createElement("input");
    c.type = "checkbox";
    c.checked = done;
    c.onchange = onTog;
    d.appendChild(c);
  }
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  const b = document.createElement("button");
  b.className = "del";
  b.textContent = "✕";
  b.onclick = onDel;
  d.appendChild(b);
  return d;
}

function renderNotes() {
  const nl = document.getElementById("nlist"), tl = document.getElementById("tlist");
  nl.innerHTML = "";
  tl.innerHTML = "";
  if (!notes.length) nl.innerHTML = '<div class="empty">Noch keine Notizen.</div>';
  if (!todos.length) tl.innerHTML = '<div class="empty">Keine Aufgaben. Alles erledigt.</div>';
  notes.forEach((n, i) => nl.appendChild(row(n.text, false, () => { notes.splice(i, 1); saveData(); renderNotes(); })));
  todos.forEach((x, i) => tl.appendChild(row(x.text, x.done,
    () => { todos.splice(i, 1); saveData(); renderNotes(); },
    () => { x.done = !x.done; saveData(); renderNotes(); })));
}

function subTab(k) {
  sub = k;
  document.getElementById("nlist").style.display = k === "n" ? "block" : "none";
  document.getElementById("tlist").style.display = k === "t" ? "block" : "none";
  document.getElementById("sub-n").classList.toggle("on", k === "n");
  document.getElementById("sub-t").classList.toggle("on", k === "t");
  document.getElementById("nin").placeholder = k === "n" ? "Neue Notiz..." : "Neue Aufgabe...";
}

function addItem() {
  const i = document.getElementById("nin"), v = i.value.trim();
  if (!v) return;
  if (sub === "n") notes.unshift({ text: v }); else todos.push({ text: v, done: false });
  saveData();
  saveData();
  i.value = "";
  renderNotes();
}

let speakOn = load("jarvis_speak", false) === true;
let rec = null;
let recOn = false;

function updSpk() {
  document.getElementById("spk").textContent = speakOn ? "🔊 Stimme" : "🔇 Stimme";
}

function toggleSpeak() {
  speakOn = !speakOn;
  save("jarvis_speak", speakOn);
  updSpk();
  if (speakOn) speak("Stimme aktiviert.");
  else if (window.speechSynthesis) speechSynthesis.cancel();
}

function speak(text) {
  if (!speakOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/\*\*/g, "").replace(/`/g, "").replace(/https?:\/\/\S+/g, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "de-DE";
  const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.indexOf("de") === 0);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Spracheingabe wird in diesem Browser nicht unterstützt. Nutze das Mikrofon-Symbol auf der Tastatur.");
    return;
  }
  const mic = document.getElementById("mic");
  if (recOn && rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "de-DE";
  rec.interimResults = true;
  rec.continuous = false;
  const inp = document.getElementById("in");
  rec.onstart = () => { recOn = true; mic.classList.add("rec"); };
  rec.onresult = e => {
    let t = "";
    for (let k = 0; k < e.results.length; k++) t += e.results[k][0].transcript;
    inp.value = t;
  };
  rec.onerror = () => { recOn = false; mic.classList.remove("rec"); };
  rec.onend = () => {
    recOn = false;
    mic.classList.remove("rec");
    if (inp.value.trim()) send();
  };
  try { rec.start(); } catch (e) {}
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
}

function add(text, cls, imgUrl, pid) {
  const pane = document.getElementById(pid || cur);
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (imgUrl) {
    const im = document.createElement("img");
    im.src = imgUrl;
    d.appendChild(im);
    const sp = document.createElement("span");
    sp.innerHTML = fmt(text);
    d.appendChild(sp);
  } else {
    d.innerHTML = fmt(text);
  }
  pane.appendChild(d);
  if (pane.style.display !== "none") d.scrollIntoView();
  return d;
}

function addSources(el, list) {
  const seen = {};
  const items = list.filter(r => r && /^https?:\/\//.test(r.url) && !seen[r.url] && (seen[r.url] = true)).slice(0, 5);
  if (!items.length) return;
  const box = document.createElement("div");
  box.className = "src";
  items.forEach(r => {
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = r.title || r.url;
    box.appendChild(a);
  });
  el.appendChild(box);
}

function buildMsgs(h) {
  let lastImg = -1;
  h.forEach((m, i) => { if (m.img) lastImg = i; });
  let msgs = h.map((m, i) => {
    if (m.img && i === lastImg) {
      return { role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: m.img } },
        { type: "text", text: m.content }
      ] };
    }
    return { role: m.role, content: m.hadImg ? "[Bild gesendet] " + m.content : m.content };
  });
  msgs = msgs.slice(-19);
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  return msgs;
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL("image/jpeg", 0.8);
      URL.revokeObjectURL(url);
      resolve({ data: dataUrl.split(",")[1], url: dataUrl });
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function send() {
  const t = cur;
  const T = tabs[t];
  if (!T) return;
  const i = document.getElementById("in");
  const btn = document.getElementById("btn");
  const core = document.getElementById("core");
  let text = i.value.trim();
  const img = (t === "chat" || t === "school") ? pendingImg : null;
  if (!text && !img) return;
  i.value = "";
  const lower = text.toLowerCase();

  if (t === "chat" && !img) {
    const nm = text.match(/^(notiz|aufgabe)\s*:\s*(.+)$/i);
    if (nm) {
      const isNote = nm[1].toLowerCase() === "notiz";
      const v = nm[2].trim();
      if (isNote) notes.unshift({ text: v }); else todos.push({ text: v, done: false });
      saveData();
      saveData();
      renderNotes();
      add(text, "user");
      add((isNote ? "Notiz" : "Aufgabe") + " gespeichert: " + v, "bot");
      return;
    }
    if (lower.startsWith("merke dir")) {
      const fact = text.slice(9).replace(/^[\s:,]+/, "").trim();
      if (fact) {
        facts.push(fact);
        saveData();
        add(text, "user");
        add("Gemerkt: " + fact, "bot");
        return;
      }
    }
    if (lower.includes("was weißt du über mich") || lower.includes("was weisst du über mich")) {
      add(text, "user");
      add(facts.length ? "Das weiß ich über dich:\n- " + facts.join("\n- ") : "Bisher weiß ich nichts. Sag einfach: Merke dir ...", "bot");
      return;
    }
    if (lower.startsWith("vergiss alles")) {
      facts = [];
      saveData();
      add(text, "user");
      add("Erledigt. Mein Gedächtnis über dich ist gelöscht.", "bot");
      return;
    }
  }

  if (t === "school" && schoolMode === "cards" && !img) { add(text, "user"); await makeCards(text); return; }
  if (img && !text) text = t === "school" ? "Hilf mir bei der Aufgabe auf dem Foto." : "Beschreibe dieses Bild.";
  add(text, "user", img ? img.url : null);
  T.h.push(img ? { role: "user", content: text, img: img.data, hadImg: true } : { role: "user", content: text });
  clearImg();
  const wait = add(t === "search" ? "sucht..." : t === "school" ? "überlegt..." : "denkt nach...", "bot");
  btn.disabled = true;
  core.classList.add("busy");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Jarvis-Code": getCode() },
      body: JSON.stringify({ messages: buildMsgs(T.h), system: buildSystem(t), mode: t === "search" ? "search" : "chat" })
    });
    if (res.status === 401) {
      try { localStorage.removeItem("jarvis_code"); } catch (e) {}
      throw new Error("Zugangscode falsch. Sende die Nachricht nochmal und gib den Code neu ein.");
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "API-Fehler");
    const blocks = data.content || [];
    const reply = blocks.filter(b => b.type === "text").map(b => b.text).join("") || "Keine Antwort erhalten (Grund: " + (data.stop_reason || "unbekannt") + ").";
    wait.innerHTML = fmt(reply);
    speak(reply);
    const results = [];
    blocks.forEach(b => { if (b.type === "web_search_tool_result" && Array.isArray(b.content)) b.content.forEach(r => results.push(r)); });
    addSources(wait, results);
    if (t === "school") addSaveBtn(wait, reply);
    T.h.push({ role: "assistant", content: reply });
  } catch (e) {
    T.h.pop();
    wait.textContent = "Fehler: " + e.message;
  }
  saveHistory(t);
  btn.disabled = false;
  core.classList.remove("busy");
  wait.scrollIntoView();
}

  try {

    const data = await api({ messages: [{ role: "user", content: "Thema: " + topic + srcTxt }], system: sys, mode: "chat" });
    if (data.error) throw new Error(data.error.message || "API-Fehler");
    const txt = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    const cards = JSON.parse(txt.slice(txt.indexOf("["), txt.lastIndexOf("]") + 1)).filter(c => c && c.q && c.a);

    renderDeck(cards, wait);
  } catch (e) {
    wait.textContent = "Fehler: " + e.message + " (nochmal versuchen)";

  core.classList.remove("busy");
}

function renderDeck(cards, host) {
  let list = cards, i = 0, known = 0, flipped = false, again = [];
  const box = document.createElement("div");
  host.appendChild(box);
  function draw() {
    box.innerHTML = "";
    if (i >= list.length) {
      const d = document.createElement("div");
      d.className = "dkdone";
      d.textContent = "Durch! " + known + " von " + list.length + " gewusst.";
      box.appendChild(d);
      if (again.length) {
        const r = document.createElement("button");
        r.className = "smallbtn";
        r.textContent = "↻ Nur die " + again.length + " offenen";
        r.onclick = () => { list = again; again = []; i = 0; known = 0; flipped = false; draw(); };
        box.appendChild(r);
      }
      return;
    }
    const c = list[i];
    const f = document.createElement("div");
    f.className = "card" + (flipped ? " back" : "");
    f.innerHTML = "<small>" + (i + 1) + " / " + list.length + (flipped ? " · Antwort" : " · Frage") + "</small><div>" + esc(flipped ? c.a : c.q) + "</div>";
    f.onclick = () => { flipped = !flipped; draw(); };
    box.appendChild(f);
    if (flipped) {
      const row = document.createElement("div");
      row.className = "dkrow";
      const y = document.createElement("button");
      y.textContent = "✓ Gewusst";
      y.onclick = () => { known++; i++; flipped = false; draw(); };
      const n = document.createElement("button");
      n.textContent = "↻ Nochmal";
      n.onclick = () => { again.push(c); i++; flipped = false; draw(); };
      row.appendChild(y); row.appendChild(n);
      box.appendChild(row);
    } else {
      const h = document.createElement("div");
      h.className = "dkhint";
      h.textContent = "Tippe die Karte zum Umdrehen";
      box.appendChild(h);
    }
  }
  draw();
}

/* ---- BWL-Rechner ---- */
function pn(s) {
  s = String(s == null ? "" : s).trim().replace(/\s/g, "");
  if (!s) return NaN;
  if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
  return parseFloat(s);
}
const nf = (n, d) => n.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = n => nf(n, 2) + " €";
const pct = n => nf(n, 2) + " %";
const ok = n => typeof n === "number" && isFinite(n);

const CALCS = [
  { id: "bep", title: "📈 Break-even", need: ["fix", "preis", "var"],
    fields: [["fix", "Fixkosten gesamt (€)", ""], ["preis", "Verkaufspreis pro Stück (€)", ""], ["var", "Variable Kosten pro Stück (€)", ""], ["ziel", "Wunschgewinn (€, optional)", ""]],
    calc: v => {
      const db = v.preis - v.var;
      if (db <= 0) return [["Hinweis", "Der Preis muss über den variablen Kosten liegen."]];
      const bep = v.fix / db, o = [["Deckungsbeitrag pro Stück", eur(db)], ["Deckungsbeitragsquote", pct(db / v.preis * 100)], ["Break-even-Menge", nf(Math.ceil(bep), 0) + " Stück"], ["Break-even-Umsatz", eur(bep * v.preis)]];
      if (v.ziel > 0) o.push(["Menge für Wunschgewinn", nf(Math.ceil((v.fix + v.ziel) / db), 0) + " Stück"]);
      return o;
    } },
  { id: "kalk", title: "🏷️ Preiskalkulation (Handel)", need: ["ek"],
    fields: [["ek", "Listeneinkaufspreis netto (€)", ""], ["lr", "Lieferantenrabatt (%)", "0"], ["ls", "Lieferantenskonto (%)", "0"], ["bz", "Bezugskosten (€)", "0"], ["hk", "Handlungskosten (%)", "0"], ["g", "Gewinnzuschlag (%)", "0"], ["ks", "Kundenskonto (%)", "0"], ["vp", "Vertreterprovision (%)", "0"], ["kr", "Kundenrabatt (%)", "0"], ["ust", "Umsatzsteuer (%)", "19"]],
    calc: v => {
      const z = v.ek * (1 - v.lr / 100), bar = z * (1 - v.ls / 100), bez = bar + v.bz, sk = bez * (1 + v.hk / 100), bvp = sk * (1 + v.g / 100);
      const d1 = 1 - (v.ks + v.vp) / 100, d2 = 1 - v.kr / 100;
      if (d1 <= 0 || d2 <= 0) return [["Hinweis", "Skonto, Provision und Rabatt ergeben zusammen 100 % oder mehr."]];
      const zvp = bvp / d1, lvp = zvp / d2;
      return [["Zieleinkaufspreis", eur(z)], ["Bareinkaufspreis", eur(bar)], ["Bezugspreis", eur(bez)], ["Selbstkosten", eur(sk)], ["Barverkaufspreis", eur(bvp)], ["Zielverkaufspreis", eur(zvp)], ["Listenverkaufspreis netto", eur(lvp)], ["Listenverkaufspreis brutto", eur(lvp * (1 + v.ust / 100))]];
    } },
  { id: "zins", title: "💰 Zinseszins & Sparen", need: ["z", "j"],
    fields: [["k0", "Startkapital (€)", "0"], ["rate", "Sparrate pro Monat (€)", "0"], ["z", "Zins pro Jahr (%)", ""], ["j", "Laufzeit (Jahre)", ""]],
    calc: v => {
      const im = Math.pow(1 + v.z / 100, 1 / 12) - 1, n = Math.round(v.j * 12);
      let bal = v.k0;
      for (let m = 0; m < n; m++) bal = bal * (1 + im) + v.rate;
      const ein = v.k0 + v.rate * n, o = [["Endkapital", eur(bal)], ["Einzahlungen", eur(ein)], ["Zinsertrag", eur(bal - ein)]];
      if (v.z > 0) o.push(["Verdopplung (72er-Regel)", "ca. " + nf(72 / v.z, 1) + " Jahre"]);
      return o;
    } },
  { id: "kredit", title: "🏦 Kredit (Annuität)", need: ["b", "z", "j"],
    fields: [["b", "Kreditbetrag (€)", ""], ["z", "Zins pro Jahr (%)", ""], ["j", "Laufzeit (Jahre)", ""]],
    calc: v => {
      const r = v.z / 100 / 12, n = Math.round(v.j * 12);
      if (n <= 0) return [["Hinweis", "Laufzeit muss größer als 0 sein."]];
      const rate = r === 0 ? v.b / n : v.b * r / (1 - Math.pow(1 + r, -n)), ges = rate * n;
      return [["Monatliche Rate", eur(rate)], ["Zinsen gesamt", eur(ges - v.b)], ["Gesamtkosten", eur(ges)], ["Zinsanteil", pct((ges - v.b) / ges * 100)]];
    } },
  { id: "marge", title: "🧮 Marge, Aufschlag & MwSt", need: [],
    fields: [["ek", "Einkaufspreis netto (€)", ""], ["vk", "Verkaufspreis netto (€)", ""], ["satz", "Umsatzsteuer (%)", "19"]],
    calc: v => {
      const o = [];
      if (ok(v.ek) && ok(v.vk) && v.ek > 0 && v.vk > 0) {
        o.push(["Gewinn pro Stück", eur(v.vk - v.ek)], ["Marge (vom Verkaufspreis)", pct((v.vk - v.ek) / v.vk * 100)], ["Aufschlag (auf Einkauf)", pct((v.vk - v.ek) / v.ek * 100)]);
      }
      if (ok(v.vk) && v.vk > 0) o.push(["Verkaufspreis brutto", eur(v.vk * (1 + v.satz / 100))], ["Enthaltene MwSt", eur(v.vk * v.satz / 100)]);
      return o;
    } },
  { id: "kenn", title: "📊 Kennzahlen", need: [],
    fields: [["gewinn", "Jahresgewinn (€)", ""], ["umsatz", "Umsatz (€)", ""], ["ek", "Eigenkapital (€)", ""], ["gk", "Gesamtkapital (€)", ""], ["um", "Umlaufvermögen (€)", ""], ["liq", "Flüssige Mittel (€)", ""], ["kv", "Kurzfristige Verbindlichkeiten (€)", ""]],
    calc: v => {
      const o = [];
      if (ok(v.gewinn) && ok(v.umsatz) && v.umsatz) o.push(["Umsatzrendite", pct(v.gewinn / v.umsatz * 100)]);
      if (ok(v.gewinn) && ok(v.ek) && v.ek) o.push(["Eigenkapitalrendite", pct(v.gewinn / v.ek * 100)]);
      if (ok(v.gewinn) && ok(v.gk) && v.gk) o.push(["Gesamtkapitalrendite", pct(v.gewinn / v.gk * 100)]);
      if (ok(v.ek) && ok(v.gk) && v.gk) o.push(["Eigenkapitalquote", pct(v.ek / v.gk * 100)]);
      if (ok(v.ek) && ok(v.gk) && v.ek) o.push(["Verschuldungsgrad", pct((v.gk - v.ek) / v.ek * 100)]);
      if (ok(v.liq) && ok(v.kv) && v.kv) o.push(["Liquidität 1. Grades", pct(v.liq / v.kv * 100)]);
      if (ok(v.um) && ok(v.kv) && v.kv) o.push(["Liquidität 3. Grades", pct(v.um / v.kv * 100)]);
      return o;
    } }
];

function buildCalcs() {
  const host = document.getElementById("calcs");
  host.innerHTML = "";
  CALCS.forEach(c => {
    const card = document.createElement("div");
    card.className = "calc";
    const h = document.createElement("button");
    h.className = "ch";
    h.textContent = c.title;
    h.onclick = () => {
      const was = card.classList.contains("open");
      document.querySelectorAll(".calc").forEach(x => x.classList.remove("open"));
      if (!was) card.classList.add("open");
    };
    const body = document.createElement("div");
    body.className = "cb";
    const inputs = {};
    c.fields.forEach(f => {
      const w = document.createElement("div");
      w.className = "fld";
      const l = document.createElement("label");
      l.textContent = f[1];
      const i = document.createElement("input");
      i.type = "text";
      i.setAttribute("inputmode", "decimal");
      i.value = f[2];
      i.addEventListener("input", upd);
      inputs[f[0]] = i;
      w.appendChild(l); w.appendChild(i);
      body.appendChild(w);
    });
    const res = document.createElement("div");
    res.className = "res";
    body.appendChild(res);
    const actions = document.createElement("div");
    const ex = document.createElement("button");
    ex.className = "smallbtn";
    ex.textContent = "🤖 Erklär mir das";
    const sv = document.createElement("button");
    sv.className = "smallbtn";
    sv.textContent = "📝 Speichern";
    actions.appendChild(ex); actions.appendChild(sv);
    body.appendChild(actions);
    let lastTxt = "";
    function upd() {
      const v = {};
      c.fields.forEach(f => { v[f[0]] = pn(inputs[f[0]].value); });
      const empty = c.need.some(k => !ok(v[k]));
      const w = {};
      Object.keys(v).forEach(k => { w[k] = ok(v[k]) ? v[k] : (c.need.indexOf(k) >= 0 ? NaN : (c.id === "marge" || c.id === "kenn" ? NaN : 0)); });
      res.innerHTML = "";
      lastTxt = "";
      if (empty) { res.innerHTML = '<span class="hint">Trage die Pflichtwerte ein, dann erscheint das Ergebnis.</span>'; return; }
      let out = [];
      try { out = c.calc(w); } catch (e) {}
      if (!out.length) { res.innerHTML = '<span class="hint">Trage mehr Werte ein.</span>'; return; }
      out.forEach(r => {
        const d = document.createElement("div");
        d.innerHTML = "<span>" + esc(r[0]) + "</span><b>" + esc(r[1]) + "</b>";
        res.appendChild(d);
      });
      const ins = c.fields.filter(f => ok(v[f[0]])).map(f => f[1] + ": " + inputs[f[0]].value).join("; ");
      lastTxt = c.title.replace(/^\S+\s/, "") + "\nEingaben: " + ins + "\nErgebnis: " + out.map(r => r[0] + " " + r[1]).join("; ");
    }
    ex.onclick = () => {
      if (!lastTxt) return;
      schoolSubject = "Wirtschaft"; schoolMode = "explain";
      save("jarvis_subject", schoolSubject); save("jarvis_mode", schoolMode);
      drawChips();
      show("school");
      document.getElementById("in").value = "Ich habe mit dem Rechner gerechnet:\n" + lastTxt + "\nErkläre mir verständlich, wie dieses Ergebnis zustande kommt (Formel, Schritt für Schritt) und was es für ein Unternehmen bedeutet.";
      send();
    };
    sv.onclick = () => {
      if (!lastTxt) return;
      notes.unshift({ text: lastTxt });
      saveData(); renderNotes();
      sv.textContent = "✓ Gespeichert";
    };
    card.appendChild(h); card.appendChild(body);
    host.appendChild(card);
    upd();
  });
}

drawChips();
buildCalcs();
renderTab("school");
renderTab("chat");
renderTab("search");
renderNotes();
document.getElementById("nin").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
show("chat");
updSpk();
pullSync();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullSync(); });
</script>
</body>
